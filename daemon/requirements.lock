# The daemon's dependencies, pinned and bound to digests.
#
# Every artifact is named by its sha256, and setup.sh installs with
# --require-hashes, which refuses a mismatch rather than warning about it. The
# daemon runs as a user service on every login: resolving a version range at
# install time would let a future or compromised release into it without anyone
# having looked.
#
# This is the full transitive closure, not a top-level list. It has to be:
# setup.sh's pip fallback passes --no-deps, so anything missing here is a
# package installed with its own dependencies silently absent.
#
# Interpreter-specific in a way the old single-package lock was not.
# onnxruntime and numpy ship compiled wheels per CPython version, and the
# hashes below cover every wheel each release published — pip picks the one
# that fits and checks it against this list. Generated against CPython 3.14 on
# x86_64.
#
# To regenerate after changing a dependency:
#
#     python3 -m venv /tmp/lockvenv
#     /tmp/lockvenv/bin/pip install onnxruntime kokoro-onnx
#     /tmp/lockvenv/bin/pip freeze | sort   # then hashes from the PyPI API
#
# soundfile is deliberately absent: the voice worker writes raw PCM to stdout,
# so there is no WAV to encode and no bundled native audio library in the
# audit surface.

